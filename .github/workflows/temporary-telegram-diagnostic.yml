name: TEMP Telegram Get Channel ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Read public channel identity
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            exit 1
          fi

          response_file="$(mktemp)"
          result_file="$(mktemp)"
          trap 'rm -f "$response_file" "$result_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --get \
              --data-urlencode 'chat_id=@GCI_Intelligence_Desk_2026' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat"
          )"

          if [[ "$http_status" != "200" ]] || ! jq -e '.ok == true' "$response_file" >/dev/null; then
            exit 1
          fi

          jq -r '"chat.id=\(.result.id)\ntitle=\(.result.title)\ntype=\(.result.type)"' "$response_file" > "$result_file"
          cat "$result_file"
          cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
