name: Get GCI Intelligence Desk Chat ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    steps:
      - name: Read channel identity
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            exit 1
          fi

          response_file="$(mktemp)"
          result_file="$(mktemp)"
          trap 'rm -f "$response_file" "$result_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --get \
              --data-urlencode 'timeout=0' \
              --data-urlencode 'allowed_updates=["channel_post"]' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates"
          )"

          if [[ "$http_status" != "200" ]] || ! jq -e '.ok == true' "$response_file" >/dev/null; then
            exit 1
          fi

          jq -r '
            [
              .result[]
              | (.channel_post // .edited_channel_post // empty)
              | select(.chat.title == "GCI Intelligence Desk")
              | { id: .chat.id, title: .chat.title, type: .chat.type }
            ]
            | unique_by(.id)
            | last
            | select(. != null)
            | "chat.id=\(.id)\nchat.title=\(.title)\nchat.type=\(.type)"
          ' "$response_file" > "$result_file"

          if [[ ! -s "$result_file" ]]; then
            exit 1
          fi

          cat "$result_file"
          cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
